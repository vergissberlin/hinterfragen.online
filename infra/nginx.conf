limit_req_zone $binary_remote_addr zone=events:10m rate=10r/m;
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Only the dedicated tunnel container may assert the original visitor IP.
  set_real_ip_from 172.29.74.5;
  real_ip_header CF-Connecting-IP;
  access_log off;
  error_log /dev/stderr warn;
  client_max_body_size 1k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self'; img-src 'self' data:; connect-src 'self' https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /internal/ { return 404; }
  location = /health { return 200 'ok'; }
  location = /api/events {
    limit_except POST { deny all; }
    limit_req zone=events burst=5 nodelay;
    proxy_pass http://backend:3001;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_set_header X-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_hide_header Cache-Control;
    add_header Cache-Control no-store always;
  }
  location = /data/runtime.json {
    alias /runtime/runtime.json;
    add_header Cache-Control "no-store" always;
  }
  location = /api/commenting-status {
    limit_except GET { deny all; }
    limit_req zone=events burst=5 nodelay;
    proxy_pass http://backend:3001;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_set_header X-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    add_header Cache-Control no-store always;
  }
  location ~ ^/api/contributions(?:/approval)?$ {
    limit_except POST { deny all; }
    client_max_body_size 256k;
    proxy_pass http://backend:3001;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_set_header X-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    add_header Cache-Control no-store always;
  }
  location ~ ^/api/auth/(config|authorize|google/callback|token|logout)$ {
    client_max_body_size 4k;
    proxy_pass http://backend:3001;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_set_header X-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
  }
  location /api/ { return 404; }
  location /data/avatars/ {
    alias /runtime/avatars/;
    add_header Cache-Control "public, max-age=86400";
  }
  location /data/ {
    alias /runtime/;
    add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate" always;
  }
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /downloads/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }
  location / { try_files $uri $uri/index.html =404; }
}
