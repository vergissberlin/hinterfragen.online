name: Discover and analyse YouTube candidates
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: youtube-agent
  cancel-in-progress: false
jobs:
  analyse:
    if: vars.ENABLE_AGENT == 'true' && vars.MODEL_LICENSE_ACCEPTED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Read immutable model and runtime identifiers
        id: config
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('config/agent.json','utf8'));
          if(!/^[a-f0-9]{40}$/.test(c.runtimeCommit)||!/^[a-f0-9]{64}$/.test(c.model.sha256))throw Error('Invalid pin');
          console.log('runtime='+c.runtimeCommit);
          console.log('model='+c.model.sha256);
          JS
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: runtime
        with:
          path: .runtime/llama-bin
          key: llama-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.config.outputs.runtime }}
      - name: Build pinned CPU runtime on cache miss
        if: steps.runtime.outputs.cache-hit != 'true'
        env:
          RUNTIME_COMMIT: ${{ steps.config.outputs.runtime }}
        run: |
          git init .runtime/llama-src
          git -C .runtime/llama-src remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C .runtime/llama-src fetch --depth=1 origin "$RUNTIME_COMMIT"
          git -C .runtime/llama-src checkout --detach FETCH_HEAD
          cmake -S .runtime/llama-src -B .runtime/llama-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build .runtime/llama-build --target llama-cli -j 4
          mkdir -p .runtime/llama-bin
          cp .runtime/llama-build/bin/llama-cli .runtime/llama-bin/
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .runtime/models
          key: llama-model-${{ steps.config.outputs.model }}
      - name: Download on cache miss and verify model on every run
        run: npx tsx scripts/ensure-model.ts
      - name: Discover, analyse and import (no raw content in logs)
        run: npm run agent
        env:
          MODEL_LICENSE_ACCEPTED: ${{ vars.MODEL_LICENSE_ACCEPTED }}
          AGENT_API_ORIGIN: ${{ vars.AGENT_API_ORIGIN }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          LLAMA_MODEL_PATH: .runtime/models/model.gguf
          LLAMA_BINARY: .runtime/llama-bin/llama-cli
