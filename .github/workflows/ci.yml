name: Verify portal
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          { POSTGRES_USER: portal, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: portal_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U portal -d portal_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.23.4', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build:plugin
      - run: git diff --exit-code -- plugins/tokens-gegen-rechts/runtime plugins/tokens-gegen-rechts/LICENSE
      - run: npm run check
      - run: npm test
        env:
          POSTGRES_TEST_URL: postgres://portal:ci-only-password@localhost:5432/portal_test
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run test:posters
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          {
            context: .,
            target: web,
            push: false,
            cache-from: 'type=gha',
            cache-to: 'type=gha,mode=max',
          }
